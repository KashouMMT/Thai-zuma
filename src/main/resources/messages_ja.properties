pricing.dating-course.subtext=基本的には、シティホテル内のレストランやバー、またはそれに準ずる場所をご指定ください。

pricing.credit-card.text=<h2>クレジットカード決済</h2><br> \
<h3>▼STEP 1</h3> \
<p>クレジットカードでのお支払いをご希望の方は、スタッフまでお申し付けください。</p><br> \
<h3>▼STEP 2</h3> \
<p>SMSにてクレジットカード決済用のURLをお送りいたします。</p><br> \
<h3>▼STEP 3</h3> \
<p>お受け取りになった決済用URLにアクセスし、オンラインでお支払いください。</p><br> \
<h3>▼STEP 4</h3> \
<p>お支払い完了後、お電話にてスタッフまでご連絡ください。</p><br>

pricing.receipt=領収書
pricing.receipt.text=ご希望の際は、必ず受付時にお申し付けください。後日のご依頼には対応できない場合がございますのでご了承ください。

pricing.howtouse.text=<h2>ご利用方法</h2><br> \
<h3>1. ご予約</h3><br> \
<p>ご希望の日時・場所をお電話またはオンラインにてお知らせください。</p><br> \
<h3>2. ご希望をお伝えください</h3><br> \
<p>ご希望のコースと女性をお選びください。オプションをご希望の際はお申し付けください。</p><br> \
<h3>3. ご予約完了</h3><br> \
<p>ご利用確認が取れ次第、ご予約が確定となります。確定後の変更・キャンセルはお受けできませんので、あらかじめご了承ください。</p><br> \
<h3>4. ご予約の確認</h3><br> \
<p>事前ご予約のお客様は、ご利用の1時間前に確認のご連絡をお願いいたします。その際、ホテルの部屋番号などが決まりましたらお知らせください。</p><br>

pricing.terms-and-condition=<h2>ご利用規約および禁止事項</h2><br> \
<p>当店は届出済みの無店舗型風俗営業店です。<br> \
お客様に安心してご利用いただけるよう、健全で安全な営業を心がけております。<br> \
また、コンパニオンが安全かつ高品質なサービスをご提供できるよう、下記の内容を必ずご確認ください。<br> \
以下に該当する方のご利用はお断りいたします。</p><br> \
<h3>【ご利用条件】</h3><br> \
<p>- 18歳未満または高校生の方。<br> \
- 常識を逸脱した過度なサービスの強要。<br> \
- 薬物使用者（危険ドラッグを含む）、または同伴者、その他当店が該当すると判断した方。<br> \
- 暴力団関係者またはそれに準ずる方、泥酔されている方。<br> \
- 性感染症に感染している、または感染の疑いがある方、女性が感染の恐れがあると判断した方。<br> \
- 同業者、またはスカウト目的の方。<br> \
- 当店スタッフへの引き抜き行為を行う方。<br> \
- ご本人以外の参加、盗聴・撮影行為などを行う方。<br> \
- 悪質な無断キャンセルをされた方。</p><br> \
<h3>【禁止事項】</h3><br> \
<p>- 女性が耐え難いと感じる過激なプレイ（暴言・脅迫・侮辱的行為など）。<br> \
- 女性の持ち物に無断で触れる行為。<br> \
- 女性との入浴を拒否された方。<br> \
- 派遣先が不衛生である場合、または女性がそう判断した場合。<br> \
- ご自宅やお部屋に他人がいる、または来る可能性がある場合。<br> \
- 無断で衣装・器具などを持ち込み使用しようとする方、またはそのような方の使用を受ける方。<br> \
- 店を通さずに女性を外で誘う、または直接会おうとする行為。<br> \
- 同業者・スカウト・それに準ずる者による引き抜き発言・行為。<br> \
- ビデオカメラ・デジタルカメラ・カメラ付き携帯などによる撮影・盗聴・盗撮行為。</p><br> \
<p>上記の禁止行為が発覚した場合、プレイ途中であっても即時サービスを中止し、料金の返金は一切いたしません。<br> \
また、悪質と判断した場合は所轄警察へ通報し、今後のご利用を固くお断りいたします。<br> \
さらに、損害が発生した場合はその賠償を請求させていただきますので、あらかじめご了承ください。</p>

pricing.first-section.title=入会金

pricing.second-section.text=<h2>初めてご利用のお客様へ</h2> \
<h3>初回ご利用について</h3> \
<p>初回ご利用時に面接などはございません。</p><br> \
<h3>基本的に男性スタッフ・ドライバーは同行いたしません。</h3> \
<p>女性単独でのご訪問となりますのでご安心ください。</p><br>

about.title=私たちについて

about.text=<h2>クラブ・アルテミスについて</h2><br> \
<h3>クラブ・アルテミス — バンコク＆パタヤのラグジュアリー・アウトコール</h3><br> \
<p>クラブ・アルテミスは、バンコク／パタヤ対応のラグジュアリー・デリバリーサービスです。ご予約からお見送りまで、上質な所作・スムーズな手配・徹底したプライバシーをお約束します。</p><br> \
<h3>提供内容</h3><br> \
<p>対応エリア： バンコク／パタヤ（ホテル・地区はお気軽にご相談ください）<br> \
営業時間： お客様のご希望の開始〜終了時刻に合わせて柔軟に手配 <br> \
言語対応： 日本語優先（JP/EN対応可） <br> \
お支払い： ご利用後の現金を推奨。ご希望が強い場合はPromptPay対応 <br> \
キャンセル： 開始2時間前まで無料。無断キャンセル（No-show）はご利用停止 <br> \
ご要望／注意点： 事前にいただいたご希望・注意事項は女性へ共有します <br>\
ブランドトーン： ラグジュアリー、時間厳守、秘密厳守</p> <br> \
<h3>ご利用の流れ</h3><br> \
<p>1）ご希望の日時・場所（バンコク／パタヤ）・条件をお知らせください <br> \
2）在籍可否と料金をご案内 <br>\
3）ご予約確定 <br>\
4）時間厳守でご到着。上質で落ち着いたお時間をお楽しみください</p><br> \
<h3>コンプライアンス</h3><br> \
<p>ご利用は18歳以上。必要に応じて身分確認をお願いする場合があります<br> \
現地ルールを順守し、違法行為は一切お断りします<br> \
個人情報は厳重に取り扱います</p>

collection.title=レディース