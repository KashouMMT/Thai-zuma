<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="public-home">
	<header id="site-header"
		class="d-flex justify-content-center align-items-center home-header"
		style="color: white"
	>
		<img
			class="main-logo-img"
			th:src="@{/public/assets/images/logo_rondo.png}"
			alt=""
		/>
	</header>
	<th:block th:replace="~{public/components/public-top-navbar :: public-top-navbar}"></th:block>
	<main class="main-content">
		<section>
			<a class="mt-3 d-block" th:href="@{/{lang}/home/cast(lang=${#locale.language})}">
				<img class="img-fluid d-block mx-auto rounded shadow mt-3"
				th:src="@{/public/assets/images/banner.png}"
				style="width: 800px;"
				alt="promotional banner"
				loading="lazy"
				decoding="async">
			</a>
		</section>
		<section>
			<h2 class="section-title text-center">
				本日の出勤<br />
				<span>セラピスト</span>
			</h2>
			<th:block th:insert="~{public/components/public-cast :: public-cast(
				products=${products},
				isHorizontalScroll=true
			)}"></th:block>
		</section>
		<section>
			<h2 class="section-title text-center">
				新人情報 <br />
				<span>NEWFACE</span>
			</h2>
			<th:block th:insert="~{public/components/public-cast :: public-cast(
				products=${productsAll},
				isHorizontalScroll=true
			)}"></th:block>
		</section>
		<section>
			<div class="container-fluid text-start">
				<h2 class="text-center" style="font-weight:800;">RONDO</h2>
				<div class="row mt-3 p-2 border-gold align-items-center">
					<div class="col-6 col-md-2 p-2">業種</div>
					<div class="col-6 col-md-10 p-2">大人のメンズエステ</div>
				</div>
				<div class="row mt-3 p-2 border-gold align-items-center">
					<div class="col-6 col-md-2 p2">派遣先</div>
					<div class="col-6 col-md-10 p-2">
						バンコク市内全域
					</div>
				</div>
				<div class="row mt-3 p-2 border-gold align-items-center">
					<div class="col-6 col-md-2 p2">営業時間</div>
					<div class="col-6 col-md-10 p-2">12:00-翌05:00</div>
				</div>
			</div>
		</section>
		<th:block
			th:insert="~{public/components/public-cta-bridge}"
		></th:block>
		<th:block
			th:insert="~{public/components/public-bottom-nav}"
		></th:block>
	</main>
</th:block>
