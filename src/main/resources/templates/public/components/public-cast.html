<th:block xmlns:th="http://www.thymeleaf.org" th:fragment="public-cast(products)">
	 <div class="container">
	 	<th:block th:each="product: ${products}">
	 		<div class="row mt-3">
		 		<div class="col-5">
					<img class="w-100" 
					th:src="@{'/files/' + ${product.getMainProductImage}}"
					alt="" />
		 		</div>
		 		<div class="col-7">
		 			<h4 th:text="${product.title}"></h4>
		 			<div th:utext="${product.description}"></div>
		 		</div>
		 	</div>
		 	<hr />
	 	</th:block>
	 </div>
</th:block>
